<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunAI Chatbot</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://jsdelivr.net"></script>
    <!-- Marked.js to support Markdown formatting -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom scrollbar and markdown styling tweaks */
        .prose p { margin-bottom: 0.75rem; }
        .prose p:last-child { margin-bottom: 0; }
        .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.75rem; list-style-type: disc; }
        .prose code { background-color: rgba(0,0,0,0.05); padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-family: monospace; }
        .prose pre { background-color: #1f2937; color: #f3f4f6; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose pre code { background-color: transparent; color: inherit; padding: 0; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">🌙 LunAI</h1>
        <button id="clearBtn" class="bg-indigo-700 hover:bg-indigo-800 text-sm px-3 py-1.5 rounded transition-colors shadow">
            Clear History
        </button>
    </header>

    <!-- Chat Area -->
    <main id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Messages will get rendered dynamically here -->
    </main>

    <!-- Input Footer -->
    <footer class="bg-white border-t border-gray-200 p-4 sticky bottom-0">
        <form id="chatForm" class="max-w-4xl w-full mx-auto flex gap-3">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask LunAI anything..." 
                required 
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow flex items-center justify-center min-w-[80px]"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        // CONFIGURATION
        const API_KEY = "SwaoRwo7I19YkbmP6Pw7vJ2IWDat8yxf";
        const API_URL = "https://api.mistral.ai/v1/chat/completions";
        const MODEL_NAME = "mistral-large-latest"; // Mistral's smartest tier model

        // DOM ELEMENTS
        const chatWindow = document.getElementById('chatWindow');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Core Conversation State (Loaded from LocalStorage if it exists)
        let conversationHistory = JSON.parse(localStorage.getItem('lunai_history')) || [
            { role: "system", content: "You are LunAI, a helpful, intelligent AI assistant powered by Mistral AI." }
        ];

        // Initialize view
        renderHistory();

        // Handle sending a message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Append user message to state & UI
            appendMessage("user", text);
            userInput.value = '';
            
            // 2. Add loading state UI
            const loadingId = appendLoadingBubble();
            setFormDisabled(true);

            try {
                // 3. Request completion from Mistral API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const replyText = data.choices[0].message.content;

                // 4. Remove loading element and save assistant message
                removeLoadingBubble(loadingId);
                appendMessage("assistant", replyText);

            } catch (error) {
                console.error("Chat Error:", error);
                removeLoadingBubble(loadingId);
                appendMessage("assistant", `⚠️ **Error connecting to LunAI:** ${error.message}. Please check your API access layout.`);
            } finally {
                setFormDisabled(false);
            }
        });

        // Clear History Handler
        clearBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to clear your conversation history?")) {
                conversationHistory = [
                    { role: "system", content: "You are LunAI, a helpful, intelligent AI assistant powered by Mistral AI." }
                ];
                localStorage.removeItem('lunai_history');
                chatWindow.innerHTML = '';
                showInitialGreeting();
            }
        });

        // UTILITY FUNCTIONS

        function appendMessage(role, content) {
            // Update Array State (ignoring structural system rules for clean saving)
            conversationHistory.push({ role, content });
            localStorage.setItem('lunai_history', JSON.stringify(conversationHistory));

            // Render to DOM
            renderMessageBubble(role, content);
            scrollToBottom();
        }

        function renderMessageBubble(role, content) {
            if (role === 'system') return; // Hide standard background system prompt

            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

            // Map Markdown content into HTML using marked.js
            const renderedContent = isUser ? escapeHTML(content) : marked.parse(content);

            wrapper.innerHTML = `
                <div class="max-w-[75%] rounded-2xl px-4 py-2.5 shadow-sm prose ${
                    isUser 
                    ? 'bg-indigo-600 text-white rounded-br-none' 
                    : 'bg-white text-gray-800 rounded-bl-none border border-gray-200'
                }">
                    <div class="text-xs font-semibold mb-1 opacity-75">${isUser ? 'You' : 'LunAI'}</div>
                    <div class="text-sm break-words leading-relaxed">${renderedContent}</div>
                </div>
            `;
            chatWindow.appendChild(wrapper);
        }

        function appendLoadingBubble() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex justify-start';
            wrapper.innerHTML = `
                <div class="max-w-[75%] rounded-2xl px-4 py-2.5 bg-white text-gray-500 rounded-bl-none border border-gray-200 shadow-sm">
                    <div class="text-xs font-semibold mb-1 opacity-75">LunAI</div>
                    <div class="flex items-center gap-1 py-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </div>
                </div>
            `;
            chatWindow.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeLoadingBubble(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        function renderHistory() {
            chatWindow.innerHTML = '';
            // If history only contains system instructions, seed a visible default welcome item
            if (conversationHistory.length <= 1) {
                showInitialGreeting();
            } else {
                conversationHistory.forEach(msg => {
                    renderMessageBubble(msg.role, msg.content);
                });
            }
            scrollToBottom();
        }

        function showInitialGreeting() {
            renderMessageBubble("assistant", "Hello! I am **LunAI**. How can I help you today? Feel free to ask code, text formulas, or lists; I support standard Markdown.");
        }

        function setFormDisabled(disabled) {
            userInput.disabled = disabled;
            sendBtn.disabled = disabled;
            if(disabled) {
                sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                userInput.focus();
            }
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
