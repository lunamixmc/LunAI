<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LunAI</title>
<style>
:root{--bg:#0e1020;--panel:#151932;--panel2:#1b2040;--line:#2a3058;--text:#e9e7f7;--dim:#9a9cc4;--accent:#8f97ff;--glow:#f3c978;--bad:#ff7a8a;--ok:#7be0b0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
:root{--onaccent:#10122a;--stars:radial-gradient(1px 1px at 20px 30px,#fff9,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff7,transparent),radial-gradient(1px 1px at 160px 20px,#fff8,transparent),radial-gradient(1px 1px at 60px 140px,#fff6,transparent),radial-gradient(1.2px 1.2px at 130px 120px,#fff7,transparent)}
body,header,aside,section,.msg,button,#code,#prompt,.card,.tab{transition:background-color .7s,color .7s,border-color .7s}
header,#filesPane,#chatPane,.tabs{background-image:var(--stars);background-size:200px 180px}
.moon{width:20px;height:20px;border-radius:50%;background:var(--glow);box-shadow:inset -7px -2px 0 0 var(--panel),0 0 16px var(--glow);display:inline-block}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
#status{color:var(--dim);font-size:12px;flex:1}#status.err{color:var(--bad)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}button:disabled{opacity:.5;cursor:default}
#modelSel,#projSel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.ib{padding:4px 8px}#projSel{max-width:220px;font-weight:600}
.att{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 8px;font-size:12px}.att img{width:22px;height:22px;object-fit:cover;border-radius:4px}.att button{border:0;background:none;padding:0 5px}
.msg img.th{max-width:140px;max-height:100px;border-radius:6px;margin:4px 4px 0 0}#attach{padding:6px 9px}
main{flex:1;display:grid;grid-template-columns:210px 1fr 380px;min-height:0}
aside,section{min-height:0;display:flex;flex-direction:column}
#filesPane{background:var(--panel);border-right:1px solid var(--line)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;color:var(--dim);font-size:12px}
#files{overflow:auto;flex:1;padding:0 6px 8px}
.f{display:flex;align-items:center;border-radius:6px}.f:hover{background:var(--panel2)}.f.on{background:var(--panel2);box-shadow:inset 2px 0 var(--glow)}
.f button{flex:1;text-align:left;background:none;border:0;padding:5px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .x{flex:0;opacity:0;padding:2px 7px}.f:hover .x{opacity:1}
.empty{color:var(--dim);padding:10px;font-size:13px}
#center{border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--panel)}
.tab{border-radius:6px 6px 0 0;border-bottom:0;background:none;border-color:transparent}.tab.on{background:var(--bg);border-color:var(--line)}
#pathbar{padding:6px 12px;font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:center}
#lang{color:var(--glow)}
#code{flex:1;width:100%;resize:none;border:0;background:var(--bg);color:var(--text);font:13px/1.55 "Cascadia Code",Consolas,Menlo,monospace;padding:10px 14px;tab-size:2;white-space:pre;overflow:auto}
#preview{flex:1;border:0;background:#fff;width:100%}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
#chatPane{background:var(--panel)}
#chat{flex:1;overflow:auto;padding:10px}
.msg{margin:0 0 12px;padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{background:var(--panel2);border-left:3px solid var(--accent);margin-left:24px}.msg .who{font-size:11px;color:var(--dim);margin-bottom:2px}
.msg pre{background:var(--panel2);padding:8px;border-radius:6px;overflow:auto;font:12px/1.5 Consolas,monospace}
.msg code{background:var(--panel2);padding:1px 4px;border-radius:4px;font-family:Consolas,monospace;font-size:12px}.msg pre code{padding:0}
.tn{font-size:12px;color:var(--ok);margin-top:3px;word-break:break-word}.tn.bad{color:var(--bad)}.dim{color:var(--dim)}
.plan{font-size:12px;margin:2px 0 6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.plan .d{color:var(--dim);text-decoration:line-through}.plan .p{color:var(--glow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}.chip{font-size:12px;border-radius:14px;padding:3px 10px}
#composer{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
#prompt{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;max-height:180px}
#settings{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}#settings.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(420px,92vw);display:flex;flex-direction:column;gap:10px}
.card input,.card select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}
[hidden]{display:none!important}
#center{position:relative}
#welcome{position:absolute;inset:74px 0 0 0;z-index:3;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
#welcome h2{margin:0;font-size:24px}#welcome p{color:var(--dim);margin:0 0 14px}
.starters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}.starters button{padding:10px 16px;font-size:14px;border-radius:10px}
#perr{background:#4a1d28;color:#ffd7de;padding:6px 12px;font-size:12px;display:flex;gap:10px;align-items:center}#perr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pathbar button{padding:2px 9px;font-size:12px}
#mnav{display:none}
@media(max-width:900px){
  main{grid-template-columns:1fr}main>*{display:none!important}
  main[data-m=chat] #chatPane,main[data-m=files] #filesPane,main[data-m=code] #center,main[data-m=run] #center{display:flex!important}
  #mnav{display:flex;background:var(--panel);border-top:1px solid var(--line)}#mnav button{flex:1;border:0;border-radius:0;padding:12px 4px;background:none}#mnav button.on{color:var(--glow);box-shadow:inset 0 2px var(--glow)}
  header #download,header #newChat{display:none}
  header{flex-wrap:wrap}#projSel,#modelSel{max-width:42vw}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="moon"></span> LunAI</div>
  <select id="projSel" aria-label="Project"></select>
  <button id="projNew" class="ib" title="New project" aria-label="New project">＋</button>
  <button id="projRename" class="ib" title="Rename project" aria-label="Rename project">✎</button>
  <button id="projDel" class="ib" title="Delete project" aria-label="Delete project">🗑</button>
  <div id="status"></div>
  <button id="undo" hidden>Undo AI edits</button>
  <button id="download">Export .json</button>
  <button id="newChat">New chat</button>
  <select id="modelSel" aria-label="Model"></select>
</header>
<main>
  <aside id="filesPane">
    <div class="ph"><span>Files</span><button id="newFile">+ New</button></div>
    <div id="files"></div>
  </aside>
  <section id="center">
    <div class="tabs">
      <button class="tab on" data-view="codeView">Code</button>
      <button class="tab" data-view="previewView">▶ Run</button>
    </div>
    <div id="pathbar"><span id="path">No file open</span><span id="lang"></span><span style="flex:1"></span><button id="reload" hidden>↻ Reload</button><button id="full" hidden>⤢ Full screen</button></div>
    <div id="welcome">
      <h2>What do you want to build?</h2>
      <p>Describe it in the chat on the right, or start with one of these.</p>
      <div class="starters">
        <button data-send="Make a Flappy Bird clone I can play in the browser">🐦 Flappy Bird</button>
        <button data-send="Build a snake game with a score and restart button">🐍 Snake game</button>
        <button data-send="Build a todo app that saves tasks in the browser">✅ Todo app</button>
        <button data-send="Make a clean personal portfolio website">🌐 Portfolio site</button>
        <button data-send="Build a calculator app">🧮 Calculator</button>
        <button data-send="Write a Python script that renames all files in a folder by date">🐍 Python script</button>
      </div>
    </div>
    <div id="perr" hidden><span id="perrmsg"></span><button id="fixerr">Ask Luna to fix</button></div>
    <div class="view on" id="codeView"><textarea id="code" spellcheck="false" placeholder="Open or create a file, or ask Luna to build something."></textarea></div>
    <div class="view" id="previewView"><iframe id="preview" sandbox="allow-scripts allow-modals"></iframe></div>
  </section>
  <aside id="chatPane">
    <div id="chat"></div>
    <div class="chips" id="chips"></div>
    <div id="pending" class="chips"></div>
    <input type="file" id="fileIn" multiple hidden>
    <div id="composer">
      <textarea id="prompt" rows="1" placeholder="Ask Luna to build, fix or explain code (Ctrl+Enter to send)"></textarea>
      <button id="attach" title="Attach files or images (or drop / paste)" aria-label="Attach files or images">📎</button>
      <button class="primary" id="send">Send</button>
      <button id="stop" hidden>Stop</button>
    </div>
  </aside>
</main>
<nav id="mnav"><button data-m="chat" class="on">💬 Chat</button><button data-m="files">📁 Files</button><button data-m="code">✎ Code</button><button data-m="run">▶ Run</button></nav>
<script>
// Model config (same setup as ai.html): name, provider type, endpoint, key, model id
const MISTRAL_URL = "https://api.mistral.ai/v1/chat/completions?login.live.com";
const MISTRAL_KEY = "SwaoRwo7I19YkbmP6Pw7vJ2IWDat8yxf";
const MODELS = [
  { name:"Codestral",        type:"mistral", url:MISTRAL_URL, key:MISTRAL_KEY, id:"codestral-latest" },
  { name:"Mistral Large",    type:"mistral", url:MISTRAL_URL, key:MISTRAL_KEY, id:"mistral-large-latest" },
  { name:"Ministral",        type:"mistral", url:MISTRAL_URL, key:MISTRAL_KEY, id:"ministral-8b-latest" },
  { name:"Gemini 3.5 Flash", type:"gemini",  url:"https://ai.celestrium-online.workers.dev?login.live.com", key:"", id:"" }
];
const LANGS = {js:"JavaScript",mjs:"JavaScript",ts:"TypeScript",tsx:"TypeScript React",jsx:"React JSX",py:"Python",html:"HTML",css:"CSS",json:"JSON",md:"Markdown",java:"Java",kt:"Kotlin",c:"C",h:"C header",cpp:"C++",cc:"C++",cs:"C#",go:"Go",rs:"Rust",rb:"Ruby",php:"PHP",swift:"Swift",sh:"Shell",bash:"Shell",sql:"SQL",lua:"Lua",dart:"Dart",r:"R",pl:"Perl",scala:"Scala",hs:"Haskell",ex:"Elixir",zig:"Zig",yml:"YAML",yaml:"YAML",toml:"TOML",xml:"XML",svg:"SVG",vue:"Vue",svelte:"Svelte",txt:"Text"};
const langOf = p => { const m = /\.([A-Za-z0-9]+)$/.exec(p || ""); return (m && LANGS[m[1].toLowerCase()]) || (/(^|\/)Dockerfile$/.test(p||"") ? "Dockerfile" : (/(^|\/)Makefile$/.test(p||"") ? "Makefile" : "Text")); };

const SYSTEM = `You are Luna, an autonomous coding agent inside LunAI, a browser-based workspace. You work in ANY programming language or format. Use the language the user asks for, else the one already in the workspace, else the most suitable one (say why in one line).

You work in a loop until the job is truly done:
1. UNDERSTAND: read the request. Inspect the workspace first (list_files, read_file, search_files) before changing anything. For any task with more than two steps, call update_plan with a markdown checklist ("- [ ] step", "- [>] in progress", "- [x] done") and keep it current.
2. ACT: make changes with write_file, edit_file, rename_file and delete_file. Prefer small, correct edits to existing code. Write complete, working, idiomatic code with sensible structure. No placeholders or TODOs.
3. OBSERVE: run it. Use run_code (JavaScript, HTML pages and Python really run in this browser), run_tests and check_project. Read the actual output, errors and logs. For web pages, pass run_code a script that clicks buttons, types into inputs and returns the resulting DOM state, so you prove each feature really works.
4. ADJUST: if anything fails, find the root cause from the evidence, fix it, and run again. Never repeat a failing action unchanged and never guess blindly. If the same problem survives two attempts, stop patching and rewrite that file a different way. If a check reports something that is actually fine (for example the word "todo" inside a todo app), do not loop: say so and move on. Add tests for non-trivial logic (JavaScript: name.test.js using test, describe, expect, assert; Python: test_name.py using unittest) and make them pass.
Finish only when verification passes, or explain precisely what blocks you. Never claim something works unless you saw it pass.

Rules:
- You DO have tools and must use them. Never say you cannot create files, and never answer with only tips. If a tool call is ever unavailable, reply with each file in a fenced code block with its path on the line directly above the fence.
- Web projects must work by opening index.html: link local css/js with relative paths, and use only CDN scripts if a library is needed.
- Other languages (Rust, Go, Java, C++ and so on) cannot run in this browser: write them carefully, re-read them, use check_project, and give the user the exact command to run them locally.
- When a project has a clear mood or subject, call set_theme once with matching hex colors (bg is the dark or light base, accent is the main color, glow is a secondary highlight).
- Files the user attaches are already in the workspace. Attached images are shown to you directly.
- Keep chat replies short: what you did, what you verified, how to run it, and one next step. Reply in the language the user writes in.`;

const TOOLS = [
  fn("list_files","List every file in the workspace with its size.",{}),
  fn("read_file","Read a file's content. Optionally pass start and end line numbers to read just a range.",{path:{type:"string"},start:{type:"integer"},end:{type:"integer"}},["path"]),
  fn("write_file","Create a file or fully replace its content.",{path:{type:"string"},content:{type:"string"}},["path","content"]),
  fn("edit_file","Replace one exact occurrence of text in a file.",{path:{type:"string"},find:{type:"string"},replace:{type:"string"}},["path","find","replace"]),
  fn("rename_file","Rename or move a file.",{path:{type:"string"},new_path:{type:"string"}},["path","new_path"]),
  fn("delete_file","Delete a file.",{path:{type:"string"}},["path"]),
  fn("set_theme","Re-color the LunAI interface to match the project mood. Colors are 6-digit hex like #0e1020.",{name:{type:"string"},bg:{type:"string"},accent:{type:"string"},glow:{type:"string"}},["bg","accent"]),
  fn("search_files","Find text across all workspace files. Returns path:line: text.",{query:{type:"string"}},["query"]),
  fn("check_project","Self-check the workspace: syntax, brackets, missing file references, missing HTML ids, placeholders, and runtime errors when the page is run. Call after writing code.",{}),
  fn("run_code","Run a file and return its console output and errors. JavaScript (.js, with CommonJS require() between workspace files), HTML pages (console logs and runtime errors) and Python (.py) really run in this browser. Test files run with their test harness. For HTML pages you may also pass script: JavaScript that runs inside the loaded page after 1 second (click buttons, type into inputs, then return the resulting DOM state or values). Its return value or error is reported, plus a snapshot of the visible page.",{path:{type:"string"},script:{type:"string"}},["path"]),
  fn("run_tests","Run every test file in the workspace (name.test.js, test.js, test_name.py) and return pass or fail details.",{}),
  fn("update_plan","Record or update your task plan as a markdown checklist: '- [ ] todo', '- [>] in progress', '- [x] done'.",{plan:{type:"string"}},["plan"])
];
function fn(name, description, properties, required = []) {
  return { type: "function", function: { name, description, parameters: { type: "object", properties, required } } };
}

const KEY = "lunai.v2";
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const state = Object.assign({ files: {}, messages: [], activePath: "", modelIdx: 0, theme: "moon" }, saved);
if (!MODELS[state.modelIdx]) state.modelIdx = 0;
const uid = () => Math.random().toString(36).slice(2, 9);
if (!Array.isArray(state.projects) || !state.projects.length) { const id = uid(); state.projects = [{ id, name: "My project", files: state.files || {}, messages: state.messages || [], activePath: state.activePath || "" }]; state.currentId = id; }
if (!state.projects.find(x => x.id === state.currentId)) state.currentId = state.projects[0].id;
{ const c = state.projects.find(x => x.id === state.currentId); state.files = c.files || {}; state.messages = c.messages || []; state.activePath = c.activePath || ""; }
let stopped = false, curLive = null, visionTurn = false, busy = false, abort = null, saveTimer = null, snapshot = null;
const $ = id => document.getElementById(id);
const els = { files:$("files"), chat:$("chat"), prompt:$("prompt"), send:$("send"), stop:$("stop"), code:$("code"), pathbar:$("path"), lang:$("lang"), modelSel:$("modelSel"), chips:$("chips"), preview:$("preview"), undo:$("undo") };

const THEMES = {
  moon:{bg:"#0e1020",panel:"#151932",panel2:"#1b2040",line:"#2a3058",text:"#e9e7f7",dim:"#9a9cc4",accent:"#8f97ff",glow:"#f3c978"},
  ocean:{bg:"#07161f",panel:"#0c2230",panel2:"#10303f",line:"#1d4a5e",text:"#e3f6fb",dim:"#85b4c4",accent:"#3fc1e0",glow:"#9ff0e0"},
  forest:{bg:"#0b1a12",panel:"#11271a",panel2:"#173522",line:"#27553a",text:"#e6f4e8",dim:"#8fb59a",accent:"#5fd08a",glow:"#d8e58a"},
  sunset:{bg:"#1c0f1c",panel:"#2a1626",panel2:"#381d30",line:"#5a2f48",text:"#fdeee6",dim:"#c99aa8",accent:"#ff8a5c",glow:"#ffc96b"},
  neon:{bg:"#08060f",panel:"#110c22",panel2:"#1a1235",line:"#3a1f6e",text:"#f1e9ff",dim:"#a58fd6",accent:"#ff3df2",glow:"#2ff3ff"},
  fire:{bg:"#170908",panel:"#251110",panel2:"#331715",line:"#5e2a22",text:"#ffece4",dim:"#c99a8c",accent:"#ff5a36",glow:"#ffb84a"},
  candy:{bg:"#1a1024",panel:"#26173a",panel2:"#321f4b",line:"#5a3a85",text:"#fff0fb",dim:"#cfa3d9",accent:"#ff7ad9",glow:"#7af0ff"},
  snow:{bg:"#eef2fa",panel:"#ffffff",panel2:"#e4eaf6",line:"#c9d3e8",text:"#1c2340",dim:"#5d688c",accent:"#4a5cf0",glow:"#d98a00"},
  terminal:{bg:"#050805",panel:"#0a110a",panel2:"#101a10",line:"#1f3a1f",text:"#c9f5c9",dim:"#6fae6f",accent:"#37e05a",glow:"#b6ff6b"},
  desert:{bg:"#1d1509",panel:"#2b2010",panel2:"#3a2c16",line:"#5f4a26",text:"#f8ecd3",dim:"#c2a979",accent:"#e8a64a",glow:"#ff7e4a"}
};
const THEME_WORDS = [
  ["ocean", /\b(ocean|sea|beach|aqua|marine|fish|surf|waves?|underwater|diving)\b/i],
  ["forest", /\b(forest|nature|trees?|plants?|garden|jungle|eco|leaf|leaves|hiking)\b/i],
  ["sunset", /\b(sunset|sunrise|golden hour|romantic|travel|wedding)\b/i],
  ["neon", /\b(neon|cyberpunk|synthwave|vaporwave|arcade|games?|gaming|futuristic)\b/i],
  ["fire", /\b(fire|lava|volcano|dragon|spicy|bbq|grill)\b/i],
  ["candy", /\b(candy|cute|pink|kawaii|kids?|bakery|cake|toys?|unicorn|baby)\b/i],
  ["snow", /\b(snow|winter|ice|minimal|minimalist|light mode|white|paper|notes?)\b/i],
  ["terminal", /\b(terminal|hacker|matrix|shell|cli|command line|console)\b/i],
  ["desert", /\b(desert|sand|western|egypt|pyramids?|coffee|cafe|vintage|retro)\b/i],
  ["moon", /\b(moon|night|space|stars?|galaxy|cosmos|astronomy|dark mode|planets?|lunar)\b/i]
];
function detectTheme(text) { for (const [n, re] of THEME_WORDS) if (re.test(text)) return n; return null; }
const isHex = h => /^#[0-9a-f]{6}$/i.test(h || "");
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lum = h => { const [r, g, b] = rgb(h); return r * .3 + g * .59 + b * .11; };
function mix(a, b, t) { const x = rgb(a), y = rgb(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function customTheme(a) {
  if (!isHex(a.bg) || !isHex(a.accent)) return null;
  const text = lum(a.bg) > 140 ? "#1c2340" : "#eeeef8";
  return { bg:a.bg, panel:mix(a.bg, text, .07), panel2:mix(a.bg, text, .13), line:mix(a.bg, text, .22), text, dim:mix(text, a.bg, .42), accent:a.accent, glow:isHex(a.glow) ? a.glow : a.accent };
}
function applyTheme(t) {
  const th = typeof t === "string" ? THEMES[t] : t;
  if (!th) return false;
  const r = document.documentElement.style;
  for (const k in th) r.setProperty("--" + k, th[k]);
  r.setProperty("--onaccent", lum(th.accent) > 150 ? "#10122a" : "#ffffff");
  state.theme = t; save();
  return true;
}

function syncCurrent() { const p = state.projects.find(x => x.id === state.currentId); if (p) { p.files = state.files; p.messages = state.messages.filter(m => m.role !== "tool").map(({ imgs, ...r }) => r); p.activePath = state.activePath; p.updated = Date.now(); } }
function save() { try { syncCurrent(); localStorage.setItem(KEY, JSON.stringify({ projects: state.projects, currentId: state.currentId, modelIdx: state.modelIdx, theme: state.theme })); } catch {} }
function setStatus(t, bad) { $("status").textContent = t; $("status").className = bad ? "err" : ""; }
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const normPath = p => String(p || "").trim().replace(/\\/g, "/").replace(/^\.?\//, "");

function md(text) {

  a.href = URL.createObjectURL(new Blob([JSON.stringify(state.files, null, 2)], { type: "application/json" }));
  a.download = curProj().name.replace(/[^\w-]+/g, "-") + ".json"; a.click(); URL.revokeObjectURL(a.href);
};
els.undo.onclick = () => { if (snapshot) { state.files = JSON.parse(snapshot); snapshot = null; closeEditorIfMissing(); if (state.activePath) openFile(state.activePath); renderFiles(); renderChat(); save(); setStatus("AI edits undone"); } };
els.files.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { if (confirm("Delete " + del.dataset.del + "?")) { delete state.files[del.dataset.del]; closeEditorIfMissing(); renderFiles(); save(); } return; }
  const b = e.target.closest("[data-path]"); if (b) { openFile(b.dataset.path); if (isMobile()) setMobile("code"); }
});
els.chips.addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) send(c.textContent); });
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showView(t.dataset.view));
els.code.addEventListener("input", () => {
  if (!state.activePath) return;
  state.files[state.activePath] = els.code.value;
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 250);
});
els.code.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); const s = els.code.selectionStart; els.code.setRangeText("  ", s, els.code.selectionEnd, "end"); els.code.dispatchEvent(new Event("input")); }
});
els.modelSel.innerHTML = MODELS.map((m, i) => `<option value="${i}">${escapeHtml(m.name)}</option>`).join("");
els.modelSel.value = state.modelIdx;
els.modelSel.onchange = () => { state.modelIdx = +els.modelSel.value; save(); setStatus("Model: " + MODELS[state.modelIdx].name); };

const pending = [];
const fileIn = $("fileIn");
function renderPending() { $("pending").innerHTML = pending.map((a, i) => `<span class="att">${a.type === "image" ? `<img src="${a.url}" alt="">` : ""}${escapeHtml(a.name)}<button data-rm="${i}" aria-label="Remove ${escapeHtml(a.name)}">×</button></span>`).join(""); }
function downscale(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .85)); }; im.onerror = rej; im.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); }); }
async function addFiles(list) {
  for (const file of [...list]) {
    if (pending.length >= 6) { setStatus("Up to 6 attachments per message", true); break; }
    try {
      if (file.type.startsWith("image/")) pending.push({ type:"image", name:file.name || "pasted-image.png", url:await downscale(file) });
      else {
        if (file.size > 300000) { setStatus(file.name + " is over 300 KB", true); continue; }
        const t = await file.text();
        if (t.includes("\u0000")) { setStatus(file.name + " looks binary, so I can't read it", true); continue; }
        pending.push({ type:"text", name:normPath(file.name), text:t });
      }
    } catch { setStatus("Couldn't read " + file.name, true); }
  }
  renderPending();
}
$("attach").onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ""; };
$("pending").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { pending.splice(+b.dataset.rm, 1); renderPending(); } });
els.prompt.addEventListener("paste", e => { const fs = [...((e.clipboardData && e.clipboardData.files) || [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } });
["dragover", "drop"].forEach(ev => $("chatPane").addEventListener(ev, e => { e.preventDefault(); if (ev === "drop") addFiles(e.dataTransfer.files); }));

const isMobile = () => matchMedia("(max-width:900px)").matches;
const mainEl = document.querySelector("main"); mainEl.dataset.m = "chat";
function setMobile(m) { mainEl.dataset.m = m; document.querySelectorAll("#mnav button").forEach(b => b.classList.toggle("on", b.dataset.m === m)); if (m === "code") showView("codeView"); if (m === "run") showView("previewView"); }
document.querySelectorAll("#mnav button").forEach(b => b.onclick = () => setMobile(b.dataset.m));
let lastErr = "";
window.addEventListener("message", e => { if (e.source === els.preview.contentWindow && e.data && e.data.lunai === 1) { lastErr = e.data.m; $("perrmsg").textContent = "⚠ " + lastErr; $("perr").hidden = false; } });
$("fixerr").onclick = () => { $("perr").hidden = true; send("The preview shows this error. Please fix it, then check again: " + lastErr); if (isMobile()) setMobile("chat"); };
$("reload").onclick = () => renderPreview();
$("full").onclick = () => { const u = URL.createObjectURL(new Blob([buildPreview()], { type: "text/html" })); window.open(u, "_blank"); };
$("welcome").addEventListener("click", e => { const b = e.target.closest("[data-send]"); if (b) { send(b.dataset.send); if (isMobile()) setMobile("chat"); } });
const curProj = () => state.projects.find(x => x.id === state.currentId);
function renderProjects() { $("projSel").innerHTML = state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join(""); $("projSel").value = state.currentId; }
function loadProject(p) {
  state.currentId = p.id; state.files = p.files; state.messages = p.messages; state.activePath = p.activePath || ""; snapshot = null; pending.length = 0; renderPending();
  if (!state.files[state.activePath]) state.activePath = Object.keys(state.files).sort()[0] || "";
  if (state.activePath) openFile(state.activePath); else { els.code.value = ""; els.pathbar.textContent = "No file open"; els.lang.textContent = ""; }
  renderProjects(); renderFiles(); renderChat(); save();
  if ($("previewView").classList.contains("on")) renderPreview();
}
function switchProject(id) {
  const p = state.projects.find(x => x.id === id);
  if (busy) { setStatus("Wait for Luna to finish first", true); renderProjects(); return; }
  if (!p || id === state.currentId) return;
  syncCurrent(); loadProject(p);
}
function newProject() {
  if (busy) { setStatus("Wait for Luna to finish first", true); return; }
  syncCurrent(); const p = { id: uid(), name: "New project", auto: true, files: {}, messages: [], activePath: "" };
  state.projects.push(p); loadProject(p); showView("codeView"); els.prompt.focus();
}
function renameProject() { const p = curProj(), n = prompt("Project name", p.name); if (n && n.trim()) { p.name = n.trim().slice(0, 60); p.auto = false; renderProjects(); save(); } }
function deleteProject() {
  if (busy) return; const p = curProj();
  if (!confirm(`Delete "${p.name}" with all its files and chat? This can't be undone.`)) return;
  const i = state.projects.indexOf(p); state.projects.splice(i, 1);
  if (!state.projects.length) state.projects.push({ id: uid(), name: "New project", auto: true, files: {}, messages: [], activePath: "" });
  loadProject(state.projects[Math.min(i, state.projects.length - 1)]);
}
$("projSel").onchange = () => switchProject($("projSel").value);
$("projNew").onclick = newProject; $("projRename").onclick = renameProject; $("projDel").onclick = deleteProject;

if (state.activePath && state.files[state.activePath] !== undefined) openFile(state.activePath);
applyTheme(state.theme && (typeof state.theme === "string" ? THEMES[state.theme] : state.theme) ? state.theme : "moon");
renderProjects();
renderFiles(); renderChat();
</script>
</body>
</html>
